# Configuration for typos spell checker
# See: https://github.com/crate-ci/typos

[files]
extend-exclude = ["target/", ".git/", "assets/"]

[default.extend-words]
# Project terms
expressir = "expressir"
Expressir = "Expressir"
parsanol = "parsanol"
Parsanol = "Parsanol"
lutaml = "lutaml"

# EXPRESS domain terms
supertype = "supertype"
subtype = "subtype"
enumeration = "enumeration"
redeclared = "redeclared"
where_rules = "where_rules"

# Rust/code terms
ast = "ast"
expr = "expr"
lexer = "lexer"
serde = "serde"

# Intentional: fixture comment data and the smrl-fullset artifact name
eleemnts = "eleemnts"
fullset = "fullset"

# EXPRESSdoc (the WG12 display format, expressir#91): typos segments
# the CamelCase compound into "EXPRES".
[default.extend-identifiers]
EXPRESSdoc = "EXPRESSdoc"
